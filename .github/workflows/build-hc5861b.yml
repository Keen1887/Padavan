name: Build HC5861B SSR

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext automake autoconf autopoint libtool libtool-bin unzip libssl-dev xsltproc wget curl fakeroot python3 python3-pip

      - name: Download toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          
      - name: Prepare HC5861B config
        run: |
          cd trunk
          cp -f configs/templates/HC5861B.config .config

          sed -i '/^CONFIG_FIRMWARE_ENABLE_IPV6=/d' .config
          echo 'CONFIG_FIRMWARE_ENABLE_IPV6=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_SMBD36=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_SMBD36=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_SFTP=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_SFTP=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_OPENVPN=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_OPENVPN=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_XUPNPD=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_XUPNPD=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_DOGCOM=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_DOGCOM=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_MINIEAP=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_MINIEAP=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_NAPT66=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_NAPT66=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_VLMCSD=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_VLMCSD=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_TTYD=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_TTYD=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_LRZSZ=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_LRZSZ=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_SRELAY=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_SRELAY=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_MENTOHUST=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_FRPC=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_FRPC=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_FRPS=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_FRPS=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_TUNSAFE=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_TUNSAFE=n' >> .config

          sed -i '/^CONFIG_FIRMWARE_INCLUDE_WIREGUARD=/d' .config
          echo 'CONFIG_FIRMWARE_INCLUDE_WIREGUARD=n' >> .config
          
      - name: Build firmware
        run: |
          cd trunk
          sudo ./clear_tree
          fakeroot ./build_firmware_modify HC5861B 0

      - name: Final firmware verification
        run: |
          echo "========== 1. FIRMWARE CONFIG =========="
          grep -n '^CONFIG_FIRMWARE_PRODUCT_ID=' trunk/.config || true
          grep -n '^CONFIG_VENDOR=' trunk/.config || true
          grep -n '^CONFIG_PRODUCT=' trunk/.config || true
          grep -n '^CONFIG_FIRMWARE_ENABLE_IPV6=' trunk/.config || true
          grep -n '^CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=' trunk/.config || true

          echo "========== 2. SSR BINARIES =========="
          test -f trunk/romfs/usr/bin/ss-local && echo "OK: ss-local"
          test -f trunk/romfs/usr/bin/ss-redir && echo "OK: ss-redir"

          echo "========== 3. SSR WEBUI =========="
          find trunk/romfs -type f \( \
            -name 'Shadowsocks.asp' \
            -o -name 'Shadowsocks_action.asp' \
            -o -name 'Shadowsocks_log.asp' \
          \) -print

          echo "========== 4. SSR RUNTIME REFERENCES =========="
          grep -Ril 'SHADOWSOCKS\|ss-redir\|ss-local' trunk/romfs 2>/dev/null | head -100 || true

          echo "========== 5. MODEL =========="
          grep -Ril 'HC5861B' trunk/configs/boards 2>/dev/null | head -20 || true

          echo "========== 6. FIRMWARE =========="
          ls -lh trunk/images/*.trx
          stat -c 'SIZE_BYTES=%s' trunk/images/*.trx

          echo "========== 7. FILESYSTEM =========="
          find trunk/romfs/usr/bin -maxdepth 1 -type f \( \
            -name 'ss-local' \
            -o -name 'ss-redir' \
          \) -exec ls -lh {} \;

          echo "========== VERIFICATION COMPLETE =========="

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: HC5861B-SSR
          path: trunk/images/*.trx
